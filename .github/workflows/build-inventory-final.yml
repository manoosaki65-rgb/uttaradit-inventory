name: Build Inventory Final
on:
  push:
    branches: [inventory-final]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-final
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish built files branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan inventory-built
          git rm -rf .
          cp -r dist/. .
          git add -A
          git commit -m "Build inventory final"
          git push -f origin inventory-built
